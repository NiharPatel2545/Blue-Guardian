[project]
name = "blue-guardian"
version = "0.5.0"
description = "A guard for AI agents and MCP tools: policy rules, a prompt-injection detector, approvals and a tamper-evident audit log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nihar Patel" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["prompt injection", "ai security", "agents", "guardrails", "llm"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "Intended Audience :: Developers"]

[project.optional-dependencies]
model = ["torch", "transformers>=4.48", "huggingface_hub"]
yaml = ["pyyaml"]

[project.scripts]
blue-guardian = "blue_guardian.cli:main"

[project.urls]
Homepage = "https://github.com/NiharPatel2545/Blue-Guardian"
Model = "https://huggingface.co/niharpatel2545/blue-guardian-v4"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blue_guardian"]
